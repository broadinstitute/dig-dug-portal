name: Nightly builds

# `schedule` only runs from the default branch. `workflow_dispatch` can target
# another ref, but only once this file exists on the default branch.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Each portal branch must still produce a production build of its own site.
  # On every portal branch the root vue.config.js is the generic master page
  # set; the portal's real site is built by pointing VUE_CLI_SERVICE_CONFIG_PATH
  # at its configs/vue.config.<Portal>.js. A plain `npm run deploy` would
  # therefore prove nothing about the portal, so each branch is paired with its
  # config. Four branches (matkp, mskkp, pankbase, sysbio) commit a
  # package-lock.json; the other seven do not, so there is no npm cache and
  # install falls back to `npm install`.
  portal-branches:
    name: portal-branches (${{ matrix.branch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: adipose_gw-main
            config: configs/vue.config.AdiposeGW.js
          - branch: cancerkp-main
            config: configs/vue.config.CancerGenetics.js
          - branch: cfde-liver-main
            config: configs/vue.config.CFDELiver.js
          - branch: cfde-main
            config: configs/vue.config.CFDE.js
          - branch: matkp-main
            config: configs/vue.config.MATKP.js
          - branch: mouse-main
            config: configs/vue.config.mouseportal.js
          - branch: mskkp-main
            config: configs/vue.config.MSKKP.js
          - branch: nephkp-main
            config: configs/vue.config.Neph.js
          - branch: pankbase-main
            config: configs/vue.config.PanKbase.js
          - branch: radiant-main
            config: configs/vue.config.RADIANT.js
          - branch: sysbio-main
            config: configs/vue.config.SysBio.js
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Production build
        env:
          # Vue CLI needs an absolute path here.
          VUE_CLI_SERVICE_CONFIG_PATH: ${{ github.workspace }}/${{ matrix.config }}
        run: npm run deploy

  # Master carries extra Vue CLI configs besides vue.config.js. They are not
  # built by CI, so build each one here.
  master-configs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - vue.configPapers.js
          - configs/vue.config.CFDE.js
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Production build
        env:
          # Vue CLI needs an absolute path here.
          VUE_CLI_SERVICE_CONFIG_PATH: ${{ github.workspace }}/${{ matrix.config }}
        run: npm run deploy
