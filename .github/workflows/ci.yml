# Portal branches (merge-down)
#
# Portal branches (matkp-main, cfde-main, ...) get this file when master merges down, but pull
# requests into them do not run it: `pull_request` below is limited to master and dev/**. On a
# portal branch the root vue.config.js is master's page set, not the portal's, so as it stands
# this workflow would build, check and e2e-test the wrong site there. Before a portal branch adds
# itself to `pull_request.branches`, its migration wave must:
#   1. build with VUE_CLI_SERVICE_CONFIG_PATH=configs/vue.config.<Portal>.js, as
#      nightly-builds.yml does: the production build here and the e2e job's baseline build
#      (npm run e2e:baseline inherits the environment);
#   2. pass that config to the dist check, which takes it as its second argument:
#      npm run check:dist -- dist configs/vue.config.<Portal>.js
#   3. point the catalog test (e2e/catalog.test.mjs loads ../vue.config.js) at the same config;
#   4. regenerate and commit a package-lock.json: 7 portal branches have none, so `npm ci` fails,
#      and master's lockfile does not match their dependencies.

name: CI

on:
  pull_request:
    branches: [master, 'dev/**']
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The ratchet compares against a base ref, so it needs the full history.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Script unit tests
        run: npm run test:scripts

      - name: Vue 3 lint ratchet
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # pull_request: compare against the PR's base branch.
          # push: compare against the previous tip; a new branch reports an all-zero SHA,
          #       which (like workflow_dispatch) means no comparison, only counts.
          BASE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/$GITHUB_BASE_REF"
          elif [ "$EVENT_NAME" = "push" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            BASE="$BEFORE_SHA"
          fi

          if [ -n "$BASE" ]; then
            npm run lint:vue3 -- --base "$BASE"
          else
            npm run lint:vue3
          fi

      - name: Production build
        run: npm run deploy

      - name: Check every page was built
        run: npm run check:dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
          # A re-run of the job uploads again under the same name.
          overwrite: true

  # Opens every catalog page in the PR's build (the `dist` artifact) and in a build of its base
  # (see "Pick the baseline ref"), and fails on anything the PR adds: a landmark that stops
  # rendering, new page errors, console errors or failed requests, or a screenshot that drifts.
  # Chromium only; the other engines run the single-build smoke test in the nightly workflow.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The baseline ref is a merge base or the previous tip, so it needs the full history.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Pick the baseline ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # pull_request: HEAD is GitHub's test-merge commit (the PR merged into its base), so
          #               this merge base is the base branch's tip that was merged in, not the
          #               commit the PR branched from. That is the build the PR would change.
          # otherwise:    the previous tip. A new branch reports an all-zero SHA and
          #               workflow_dispatch has none, so both use the commit before this one.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! REF=$(git merge-base HEAD "origin/$GITHUB_BASE_REF"); then
              echo "::error::No merge base between HEAD and origin/$GITHUB_BASE_REF."
              exit 1
            fi
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            REF="$BEFORE_SHA"
          else
            REF="HEAD~1"
          fi

          # Fail here, not after the baseline build starts, if the ref names no commit.
          if ! BASE=$(git rev-parse --verify --quiet "$REF^{commit}"); then
            echo "::error::Baseline ref '$REF' ($EVENT_NAME event) does not resolve to a commit in this checkout."
            exit 1
          fi
          echo "Baseline ref: $BASE"
          echo "BASE=$BASE" >> "$GITHUB_ENV"

      - name: Build the baseline
        run: npm run e2e:baseline -- "$BASE"

      - name: Note that this run has no live BioIndex data
        run: |
          echo "e2e ran with no live BioIndex data (E2E_NO_LIVE_DATA=1): GitHub-hosted runners get a Cloudflare managed challenge (403) from bioindex.hugeamp.org and ld.hugeamp.org. The smoke test skips the pages whose landmark needs that data, and the A/B comparison sees the same empty data in both builds." >> "$GITHUB_STEP_SUMMARY"

      - name: A/B e2e (Chromium)
        env:
          # GitHub-hosted runners get a Cloudflare managed challenge (403) from
          # bioindex.hugeamp.org and ld.hugeamp.org, so no live BioIndex data is
          # available. This aborts every live-data request instead of running against
          # challenge pages. Remove it once the runners are allowlisted or a
          # self-hosted runner is used.
          E2E_NO_LIVE_DATA: '1'
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          # A re-run of the job uploads again under the same name.
          overwrite: true
